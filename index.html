<style>
/* Layout: navegação em pílulas no topo, superfícies arredondadas flutuando sobre fundo verde-acinzentado claro */

}

  --bg:#101512;--surface:#18201a;--soft:#1e2720;--soft-2:#26312a;--line:#2b362e;
  --fg:#e7eee8;--fg-2:#b0bdb3;--fg-3:#7d8a80;--accent:#4fca84;--accent-fg:#0b1a10;--accent-soft:#1d3527;--accent-ink:#8fe0b0;
  --lv-c:#a993f2;--lv-d:#649cf2;--lv-e:#3fcfb0;--occ:#4d584f;--vag:#ecb847;
  --g1:#649cf2;--g2:#f08a62;--g3:#3fcfb0;--g4:#ecb847;--g5:#e48bb6;--g6:#9488ec;
  --ok:#62d283;--ok-bg:#1b3323;--warn:#f0c062;--warn-bg:#382d16;--bad:#f28c8c;--bad-bg:#3c1f1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512;--surface:#18201a;--soft:#1e2720;--soft-2:#26312a;--line:#2b362e;
  --fg:#e7eee8;--fg-2:#b0bdb3;--fg-3:#7d8a80;--accent:#4fca84;--accent-fg:#0b1a10;--accent-soft:#1d3527;--accent-ink:#8fe0b0;
  --lv-c:#a993f2;--lv-d:#649cf2;--lv-e:#3fcfb0;--occ:#4d584f;--vag:#ecb847;
  --g1:#649cf2;--g2:#f08a62;--g3:#3fcfb0;--g4:#ecb847;--g5:#e48bb6;--g6:#9488ec;
  --ok:#62d283;--ok-bg:#1b3323;--warn:#f0c062;--warn-bg:#382d16;--bad:#f28c8c;--bad-bg:#3c1f1f;

html,body{margin:0}

body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:1220px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:24px;font-weight:800}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:700}

button,select,input,textarea{font:inherit;color:inherit}
button{border:none;background:var(--soft-2);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap;transition:background .15s,transform .1s}
button:hover{background:var(--line)}button:active{transform:scale(.98)}

input[type=number]{width:70px;text-align:center}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;gap:14px;align-items:center}

.lvdot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;font-size:11px;font-weight:800;color:#fff}
.lv-C{background:var(--lv-c)}.lv-D{background:var(--lv-d)}.lv-E{background:var(--lv-e)}
:root[data-theme="dark"] .lvdot{color:#0b1a10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lvdot{color:#0b1a10}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}

.neg{color:var(--bad)}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.step{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:6px 18px 6px 6px;color:var(--fg-2)}
.step b{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--soft-2);font-size:13px}
.step[aria-selected=true]{background:var(--accent-soft);color:var(--accent-ink)}.step[aria-selected=true] b{background:var(--accent);color:var(--accent-fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--soft);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tile .tt{font-weight:700}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{background:var(--soft);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--fg-2)}
.tog[aria-pressed=true]{background:var(--bad-bg);color:var(--bad)}
.grp{margin-bottom:22px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 6px 10px;flex-wrap:wrap}
.ulist{display:flex;flex-direction:column;gap:8px}
.urow{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 16px;display:grid;grid-template-columns:minmax(140px,1fr) minmax(150px,1.3fr) auto 172px;gap:14px;align-items:center}
.urow.out{opacity:.72}
.mug{margin-top:12px}.mug .eyebrow{margin-bottom:8px}.mugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mui{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:14px;padding:6px 6px 6px 14px;min-width:0}.mui span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mui input{width:64px;text-align:center;background:var(--surface);border-radius:10px}.mui.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.mu{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.excb{font-size:12px;padding:5px 12px;background:var(--warn-bg);color:var(--warn)}.excb:hover{background:var(--warn-bg);filter:brightness(.97)}
.retv{margin-top:6px;font-size:12px;color:var(--warn);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.rv{display:inline-flex;align-items:center;gap:4px;background:var(--warn-bg);border-radius:999px;padding:2px 4px 2px 10px}.rv button{font-size:11.5px;padding:2px 8px}
.psec{margin-bottom:22px}.psec-h{display:flex;align-items:center;gap:10px;margin:0 4px 12px}.psec-h h3{font-size:16px}.cnt{background:var(--soft-2);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--fg-2)}.psec-e{padding:14px 18px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px;border:2px dashed var(--line);min-width:0}.dcard.cur{border:2px solid var(--warn)}
.dprog{height:10px;border-radius:99px;background:var(--soft-2);overflow:hidden}.dprog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.plist{display:flex;flex-direction:column;gap:8px}.pitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:16px;padding:12px 16px;background:var(--soft);white-space:normal}.pitem span{font-size:12.5px;font-weight:500;color:var(--fg-3)}
.gsaldo,.rsaldo{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.rsaldo{margin-top:6px;justify-content:center;width:100%}.gsaldo{margin-left:auto}
.sml{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3)}
.smn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 9px 2px 3px;border-radius:999px;background:var(--soft-2)}.smn .lvdot{width:18px;height:18px;font-size:10px}.smn.zero{opacity:.55}.smn.neg{background:var(--bad-bg);color:var(--bad)}
.stw{min-width:0}
.urow.hit-ref{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok),var(--shadow)}
.urow.hit-meta{box-shadow:inset 0 0 0 2px var(--ok),var(--shadow)}
.lg.hl{margin-top:-6px}.hsw{display:inline-block;width:18px;height:12px;border-radius:4px}.hsw.ref{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}.hsw.meta{box-shadow:inset 0 0 0 2px var(--ok)}.hsw.out{background:var(--soft-2);opacity:.8}
.where{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--soft-2);color:var(--fg-2);font-size:13px;line-height:1.5}
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;background:var(--surface);border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:10px 14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.dk-saldo,.dk-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dk-l{font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.04em}
.dock{border:2px solid var(--accent)}.dock.done{border-color:var(--ok)}
.dk-saldo{gap:10px!important}
.dk-tt{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:16px;background:var(--accent);color:var(--accent-fg)}.dk-tt b{font-size:30px;font-weight:800;line-height:1;min-width:46px;text-align:center}.dk-tt span{font-size:12px;font-weight:700;line-height:1.25;text-transform:uppercase;letter-spacing:.03em}
.dock.done .dk-tt{background:var(--ok-bg);color:var(--ok)}.dock.over{border-color:var(--bad)}.dock.over .dk-tt{background:var(--bad);color:var(--bg)}
.dk-n{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:16px;background:var(--soft-2)}.dk-n b{font-size:26px;font-weight:800;line-height:1}.dk-n .lvdot{width:28px;height:28px;font-size:13px}.dk-of{font-size:12px;color:var(--fg-3);font-weight:600}
.dk-C{background:color-mix(in srgb,var(--lv-c) 16%,var(--surface))}.dk-D{background:color-mix(in srgb,var(--lv-d) 16%,var(--surface))}.dk-E{background:color-mix(in srgb,var(--lv-e) 16%,var(--surface))}
.dk-n.zero{background:var(--soft-2)}.dk-n.zero b{color:var(--fg-3)}.dk-n.neg{background:var(--bad-bg);color:var(--bad)}
.stp button:disabled{opacity:.3;cursor:not-allowed;transform:none}
.dk-m{font-size:13px;font-weight:600;color:var(--fg-2);padding:4px 10px;border-radius:999px;background:var(--soft-2)}
.dk-msg{flex-basis:100%;font-size:13px;padding:8px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn)}.dk-msg.bad{background:var(--bad-bg);color:var(--bad)}
@media (max-width:860px){.dk-act{flex-wrap:nowrap!important}.dk-act .chip{white-space:normal;font-size:11px}.dk-act button{padding:8px 12px;font-size:13px}.dk-tt{flex-basis:100%;justify-content:center}.dk-tt b{font-size:24px}.dk-n{flex:1;justify-content:center;padding:5px 8px 5px 5px}.dk-n b{font-size:20px}.dk-n .lvdot{width:24px;height:24px}.dk-of{display:none}.dock{padding:8px 10px;border-radius:16px;gap:8px}.dk-l{flex-basis:100%}.dk-n{font-size:14px;padding:3px 10px 3px 4px}.dk-act{width:100%;justify-content:space-between}}
.uname{font-weight:700;line-height:1.25}
.uname .muted{font-weight:500}
.pbar{position:relative;height:12px;border-radius:999px;background:var(--soft-2);overflow:visible}
.pbar .fill{position:absolute;inset:0 auto 0 0;display:flex;border-radius:999px;overflow:hidden}
.pbar .fill i{display:block;height:100%}
.pbar .ref{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--fg-2)}
.pbar .meta{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2.5px dotted var(--bad)}
.pnum{font-size:12px;color:var(--fg-2);margin-top:5px}
.steppers{display:flex;gap:8px}

.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--fg-2);margin-bottom:12px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:999px;display:inline-block}
.rcv{display:flex;gap:4px;flex-wrap:wrap}

.prow{display:grid;grid-template-columns:180px minmax(0,1fr) 150px 170px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px}

.pgt{font-weight:700;margin:16px 0 4px;color:var(--fg-2);font-size:13px}

<script>
const LV=["C","D","E"];
const S={base:null,props:[],cur:null,curId:null,dirty:false,tab:"inicio",step:1,grouping:"tip",pan:false,db:null,dbState:"loading",confirm:null,showAllCargos:false,editGrouping:null,focusId:null,cmp:null,quadro:null,desej:{},defs:{},defPropId:null,defUnit:null,defDirty:false,imp:null,impC:null,prog:"",sample:null,assets:null,qOpen:null};
try{S.tab="inicio";const g=localStorage.getItem("dim.grp");if(g)S.grouping=g;S.pan=localStorage.getItem("dim.pan")==="1";const st=localStorage.getItem("dim2.step");if(st)S.step=+st||1}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const n=v=>{const x=parseInt(v,10);return isNaN(x)?0:x};
const sum3=o=>LV.reduce((a,l)=>a+(o?.[l]||0),0);
const trip=o=>LV.map(l=>o?.[l]||0).join(" · ");
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>new Date().toLocaleDateString("pt-BR");
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const GC=["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)","var(--g6)"];
const CARGOS_BASE=["Técnico em Educação","Analista em Educação","Assistente em Administração","Técnico em Assuntos Educacionais","Técnico de Laboratório-Área","Técnico de Tecnologia da Informação","Analista de Tecnologia da Informação","Administrador","Contador","Bibliotecário-Documentalista","Pedagogo-Área","Psicólogo-Área","Assistente Social","Enfermeiro-Área","Médico-Área","Odontólogo","Nutricionista","Engenheiro-Área","Engenheiro Agrônomo","Engenheiro de Segurança do Trabalho","Arquiteto e Urbanista","Arquivista","Auditor","Jornalista","Revisor de Textos","Tradutor e Intérprete de Linguagem de Sinais","Técnico em Agropecuária","Técnico em Química","Técnico em Enfermagem","Técnico em Contabilidade","Técnico em Secretariado","Assistente de Aluno","Zootecnista","Médico Veterinário","Tecnólogo-Formação","Assistente de Laboratório","Auxiliar em Administração","Secretário Executivo","Técnico em Segurança do Trabalho","Nutricionista","Técnico em Arquivo","Técnico em Audiovisual","Programador Visual","Relações Públicas","Economista","Estatístico","Músico","Operador de Câmera de Cinema e TV","Técnico em Alimentos e Laticínios","Técnico em Edificações","Técnico em Eletrotécnica","Técnico em Mecânica","Técnico em Laboratório","Vigilante","Motorista","Recepcionista","Telefonista","Porteiro","Auxiliar de Biblioteca"];

/* ---------- cálculo ---------- */
const tipOf=u=>S.base.tipologias.find(t=>t.id===u.tipologia);
function refOf(u){const r=u.ref;if(r&&LV.some(l=>r[l]!==undefined&&r[l]!==""))return{C:n(r.C),D:n(r.D),E:n(r.E)};const t=tipOf(u);return t?{C:n(t.ref.C),D:n(t.ref.D),E:n(t.ref.E)}:{C:0,D:0,E:0}}
function vOk(v,P){return v.considerar!==false&&!((P||S.cur)?.retiradas||{})[v.codigo]}
function vagasOf(id,P){const o={C:0,D:0,E:0};for(const v of S.base.vagas)if(v.unidade===id&&vOk(v,P)&&o[v.nivel]!==undefined)o[v.nivel]++;return o}
function retOf(P){const o={C:0,D:0,E:0};const r=(P||S.cur)?.retiradas||{};for(const v of S.base.vagas)if(r[v.codigo]&&v.considerar!==false&&o[v.nivel]!==undefined)o[v.nivel]++;return o}
function alocOf(id,P){const a=(P||S.cur)?.aloc?.[id]||{};return{C:n(a.C),D:n(a.D),E:n(a.E)}}
function info(u,P){
  P=P||S.cur;
  const ref=refOf(u),oc={C:n(u.ocup?.C),D:n(u.ocup?.D),E:n(u.ocup?.E)},ab=n(u.ab),va=vagasOf(u.id,P),no=alocOf(u.id,P);
  const prev={};LV.forEach(l=>prev[l]=oc[l]+va[l]+no[l]);
  const occT=sum3(oc)+ab,vaT=sum3(va),noT=sum3(no),tot=sum3(prev)+ab,refT=sum3(ref);
  const mu=P?.metasU?.[u.id];const metaU=mu!==undefined&&mu!==null&&mu!=="";
  const excl=!metaU&&(P?.excluidas||[]).includes(u.id);
  const mv=P?.metas?.[u.tipologia];const meta=metaU?n(mu):(!excl&&mv!==undefined&&mv!==null&&mv!=="")?n(mv):null;
  let st;
  const hitRef=refT>0&&tot>=refT,hitMeta=meta!==null&&tot>=meta;
  if(hitRef)st={c:"ok",t:tot>refT?`Tipologia completa (+${tot-refT})`:"Tipologia completa"};
  else if(excl)st={c:"mute",t:"Fora da meta"};
  else if(meta!==null)st=hitMeta?{c:"ok",t:"Meta atingida"}:{c:"bad",t:`Faltam ${meta-tot} p/ meta`};
  else st={c:"warn",t:`Faltam ${refT-tot} p/ tipologia`};
  return{ref,oc,ab,va,no,prev,occT,vaT,noT,tot,refT,meta,metaU,excl,st,hitRef,hitMeta};
}
function pool(P){
  const rec={C:0,D:0,E:0},al={C:0,D:0,E:0};
  for(const lt of S.base.lotes)if(rec[lt.nivel]!==undefined)rec[lt.nivel]+=n(lt.qtd);
  const rt=retOf(P);LV.forEach(l=>rec[l]+=rt[l]);
  for(const u of S.base.unidades){const a=alocOf(u.id,P);LV.forEach(l=>al[l]+=a[l])}
  const sd={};LV.forEach(l=>sd[l]=rec[l]-al[l]);return{rec,al,sd};
}
function stats(P){
  const all=S.base.unidades.map(u=>info(u,P));const wm=all.filter(i=>i.meta!==null);
  return{all,meta:wm.length,ok:wm.filter(i=>i.tot>=i.meta).length,def:all.reduce((a,i)=>a+Math.max(0,i.refT-i.tot),0),aloc:all.reduce((a,i)=>a+i.noT,0),pool:pool(P)};
}
function groups(){
  const U=S.base.unidades;const ag=S.base.agrupamentos.find(g=>g.id===S.grouping);
  if(!ag){const out=S.base.tipologias.map(t=>({id:t.id,nome:t.nome,units:U.filter(u=>u.tipologia===t.id)}));const sem=U.filter(u=>!tipOf(u));if(sem.length)out.push({id:"_",nome:"Sem tipologia",units:sem});return out.filter(g=>g.units.length)}
  const used=new Set();const out=ag.grupos.map(g=>{const units=U.filter(u=>(g.unidades||[]).includes(u.id));units.forEach(u=>used.add(u.id));return{id:g.id,nome:g.nome,units}});
  const sem=U.filter(u=>!used.has(u.id));if(sem.length)out.push({id:"_",nome:"Sem grupo",units:sem});return out.filter(g=>g.units.length);
}
function groupingSelect(sid){return `<label class="small" for="${sid}">Organizar por</label><select id="${sid}" data-act="grp"><option value="tip"${S.grouping==="tip"?" selected":""}>Tipologia</option>${S.base.agrupamentos.map(a=>`<option value="${esc(a.id)}"${S.grouping===a.id?" selected":""}>${esc(a.nome)}</option>`).join("")}</select>`}
const propById=id=>S.props.find(p=>p.id===id);
const strip=p=>{const {id,...d}=p;return clone(d)};

/* ---------- persistência ---------- */
let baseTimer=null,baseWriting=false,basePending=false,baseLocal=false;
function touchBase(){render();if(!S.db)return;baseLocal=true;clearTimeout(baseTimer);baseTimer=setTimeout(flushBase,700)}
async function flushBase(){if(baseWriting){basePending=true;return}baseWriting=true;try{await S.db.doc("ws/base").set(clone(S.base))}catch(e){flash("Não foi possível salvar os cadastros: "+(e.message||e.code),"warn")}baseWriting=false;if(basePending){basePending=false;flushBase()}else baseLocal=false}
const isDraft=p=>p&&p.situacao==="rascunho";
let propTimer=null,propWriting=false,propPending=false;
function markDirty(){S.dirty=true;render();clearTimeout(propTimer);propTimer=setTimeout(flushProp,900)}
async function flushProp(){
  clearTimeout(propTimer);if(!S.cur||!S.curId||!S.dirty)return;
  if(propWriting){propPending=true;return}
  propWriting=true;S.saveState="saving";
  const id=S.curId,doc=clone(S.cur);doc.atualizadaEm=new Date().toISOString();S.cur.atualizadaEm=doc.atualizadaEm;S.dirty=false;
  const i=S.props.findIndex(p=>p.id===id);const rec={id,...clone(doc)};if(i>=0)S.props[i]=rec;else S.props.push(rec);
  if(!S.db){S.saveState="local";propWriting=false;render();return}
  render();
  try{await S.db.doc("propostas/"+id).set(doc);S.saveState="ok"}catch(e){S.dirty=true;S.saveState="err";flash("Não foi possível salvar: "+(e.message||e.code),"warn")}
  propWriting=false;render();if(propPending){propPending=false;flushProp()}
}
async function saveProp(asCopy){
  if(!S.cur)return;await flushProp();
  if(!asCopy)return;
  const now=new Date().toISOString();const id=uid();const doc=clone(S.cur);doc.nome=doc.nome+" (cópia)";doc.criadaEm=now;doc.atualizadaEm=now;doc.aprovada=false;doc.situacao="rascunho";
  S.props.push({id,...clone(doc)});openProp(id,doc);
  if(S.db)try{await S.db.doc("propostas/"+id).set(doc);flash("Cópia criada e aberta para preenchimento","ok")}catch(e){flash("Não foi possível criar a cópia: "+(e.message||e.code),"warn")}
}
function openProp(id,doc){S.cur=clone(doc||strip(propById(id)));S.curId=id;S.dirty=false;S.saveState="ok";S.confirm=null;S.tab="construir";save("dim2.tab","construir");save("dim2.cur",id);render();window.scrollTo(0,0)}
async function editProp(id){if(id!==S.curId)await flushProp();const p=propById(id);if(!p)return;if(id===S.curId&&S.cur){S.tab="construir";save("dim2.tab","construir");render();window.scrollTo(0,0);return}openProp(id)}
async function newProp(){
  await flushProp();const now=new Date().toISOString();const id=uid();
  const doc={nome:"Proposta "+(S.props.length+1)+" – "+today(),descricao:"",metas:{},excluidas:[],aloc:{},autoAloc:{},cargos:{},vagaNotas:{},situacao:"rascunho",criadaEm:now,atualizadaEm:now};
  S.props.push({id,...clone(doc)});S.step=1;openProp(id,doc);
  if(S.db)try{await S.db.doc("propostas/"+id).set(doc)}catch(e){flash("Não foi possível criar a proposta: "+(e.message||e.code),"warn")}
}
async function setSituacao(id,sit){
  if(id===S.curId&&S.cur){S.cur.situacao=sit;S.dirty=true;await flushProp()}
  else{const p=propById(id);if(!p)return;p.situacao=sit;render();if(S.db)try{await S.db.doc("propostas/"+id).update({situacao:sit})}catch(e){flash("Não foi possível gravar.","warn")}}
}
let flashT=null;
function flash(msg,kind){$("#status").innerHTML=`<div class="toast ${kind==="ok"?"ok":""}" role="status">${esc(msg)}</div>`;clearTimeout(flashT);flashT=setTimeout(()=>{$("#status").innerHTML=""},4000)}

/* ---------- distribuição automática ---------- */
function dropAuto(id){const a=S.cur.aloc?.[id],x=S.cur.autoAloc?.[id];let r=0;if(a&&x)LV.forEach(l=>{const k=Math.min(n(a[l]),n(x[l]));a[l]=n(a[l])-k;r+=k});if(S.cur.autoAloc)delete S.cur.autoAloc[id];return r}
function setExcl(id,on){
  const s=new Set(S.cur.excluidas||[]);on?s.add(id):s.delete(id);S.cur.excluidas=[...s];if(on&&S.cur.metasU)delete S.cur.metasU[id];
  const u=S.base.unidades.find(x=>x.id===id);const nm=u?u.nome:id;
  if(on){const r=dropAuto(id);const left=sum3(alocOf(id));
    if(left>0)S.confirm="exclRet:"+id;else S.confirm=null;
    if(r)flash(`${nm} saiu da meta: ${r} vaga${r>1?"s":""} distribuída${r>1?"s":""} pela meta voltaram ao saldo.`,"ok");
    else if(!left)flash(`${nm} saiu da meta.`,"ok");}
  else{if(S.confirm==="exclRet:"+id)S.confirm=null;flash(`${nm} voltou para a meta. Clique em "Distribuir pelas metas" para completar.`,"ok")}
  markDirty();
}
function retirarExc(id){
  const u=S.base.unidades.find(x=>x.id===id);if(!u)return;const i=info(u);let ex=i.tot-i.refT;if(ex<=0)return;
  const over=l=>i.prev[l]-i.ref[l];let dn=0;const codes=[];S.cur.aloc=S.cur.aloc||{};
  while(ex>0){const lv=LV.filter(l=>n(S.cur.aloc[id]?.[l])>0).sort((a,b)=>over(b)-over(a));if(!lv.length)break;const l=lv[0];S.cur.aloc[id][l]--;const x=S.cur.autoAloc?.[id];if(x&&x[l]>0)x[l]--;i.prev[l]--;ex--;dn++}
  if(ex>0){S.cur.retiradas=S.cur.retiradas||{};const vs=S.base.vagas.filter(v=>v.unidade===id&&vOk(v));
    while(ex>0&&vs.length){vs.sort((a,b)=>over(b.nivel)-over(a.nivel));const v=vs.shift();S.cur.retiradas[v.codigo]=true;codes.push(v.codigo);i.prev[v.nivel]--;ex--}}
  markDirty();flash(`${u.nome}: excedente retirado${dn?` — ${dn} vaga${dn>1?"s":""} nova${dn>1?"s":""} devolvida${dn>1?"s":""} ao saldo`:""}${codes.length?`${dn?" e":" —"} ${codes.length} vaga${codes.length>1?"s":""} existente${codes.length>1?"s":""} (código ${codes.join(", ")}) remanejada${codes.length>1?"s":""} para o saldo`:""}.`,"ok");
}
function autoDist(){
  S.cur.aloc=S.cur.aloc||{};let rem=0;for(const id of Object.keys(S.cur.autoAloc||{}))rem+=dropAuto(id);S.cur.autoAloc={};
  const sd={...pool().sd};const UI={};for(const u of S.base.unidades)UI[u.id]=info(u);
  for(let g=0;g<5000;g++){
    let best=null,bd=0;for(const u of S.base.unidades){const i=UI[u.id];if(i.meta===null)continue;const d=i.meta-i.tot;if(d>bd){bd=d;best=u}}
    if(!best)break;const i=UI[best.id];const lv=LV.filter(l=>sd[l]>0);if(!lv.length)break;
    lv.sort((a,b)=>((i.ref[b]-i.prev[b])-(i.ref[a]-i.prev[a]))||(sd[b]-sd[a]));const l=lv[0];
    const a=S.cur.aloc[best.id]||(S.cur.aloc[best.id]={C:0,D:0,E:0});a[l]=n(a[l])+1;const x=S.cur.autoAloc[best.id]||(S.cur.autoAloc[best.id]={C:0,D:0,E:0});x[l]++;sd[l]--;i.prev[l]++;i.tot++;i.no[l]++;
  }
  S.confirm=null;markDirty();const left=sum3(sd);flash(left?`Metas aplicadas (a distribuição automática anterior foi refeita; lançamentos manuais mantidos). Restam ${trip(sd)} (C · D · E) para distribuir à mão.`:"Metas aplicadas. Todas as vagas recebidas foram alocadas.","ok");
}
function genCargos(id){
  const a=alocOf(id);const lines=[];
  for(const l of LV){const q=a[l];if(!q)continue;const lots=S.base.lotes.filter(x=>x.nivel===l);
    lines.push({id:uid(),cargo:lots[0]?.cargo||"",nivel:l,qtd:q,status:lots.length>1?"discutir":"proposto",obs:lots.length>1?"Definir entre os cargos recebidos":""});}
  S.cur.cargos=S.cur.cargos||{};S.cur.cargos[id]=lines;
}

/* ---------- componentes visuais ---------- */
function pbar(i){
  const base=Math.max(i.refT,i.meta||0,i.tot,1);const k=v=>v/base*100;
  const seg=(v,c)=>v>0?`<i style="width:${k(v)}%;background:${c}"></i>`:"";
  return `<div class="pbar"><div class="fill" style="width:100%">${seg(i.occT,"var(--occ)")}${seg(i.vaT,"var(--vag)")}${seg(i.no.C,"var(--lv-c)")}${seg(i.no.D,"var(--lv-d)")}${seg(i.no.E,"var(--lv-e)")}</div><div class="ref" style="left:calc(${k(i.refT)}% - 1px)"></div>${i.meta!==null?`<div class="meta" style="left:${k(i.meta)}%"></div>`:""}</div>`;
}
function recv(i,withVag){const out=LV.filter(l=>i.no[l]).map(l=>`<span class="rc" title="Recebe ${i.no[l]} vaga(s) nova(s) de nível ${l}"><span class="lvdot lv-${l}">${l}</span>+${i.no[l]}</span>`);if(withVag&&i.vaT)out.push(`<span class="rc v" title="Vagas já existentes">${i.vaT} exist.</span>`);return `<div class="rcv">${out.join("")||'<span class="muted">não recebe</span>'}</div>`}
const legend=()=>`<div class="lg"><span><i class="sw" style="background:var(--occ)"></i>Ocupados</span><span><i class="sw" style="background:var(--vag)"></i>Vagas existentes</span><span><i class="sw" style="background:var(--lv-c)"></i>Nova C</span><span><i class="sw" style="background:var(--lv-d)"></i>Nova D</span><span><i class="sw" style="background:var(--lv-e)"></i>Nova E</span><span><i class="sw" style="background:var(--fg-2);border-radius:2px;width:3px"></i>Referência</span><span><i style="border-left:2.5px dotted var(--bad);height:12px"></i>Meta</span></div>`;
function panoramaHTML(P,title){
  const s=stats(P);
  let h=`<div class="card"><div class="card-h"><div><div class="eyebrow">Panorama do IFRN</div><h2>${esc(title)}</h2></div><div class="row">${groupingSelect("selGrpPan")}<button class="ghost" data-act="pan">Fechar</button></div></div>
  <div class="kpis"><div class="kpi"><span class="eyebrow">Vagas novas alocadas</span><span class="big">${s.aloc}</span><span class="sub">saldo ${sum3(s.pool.sd)} · C ${s.pool.sd.C} · D ${s.pool.sd.D} · E ${s.pool.sd.E}</span></div>
  <div class="kpi"><span class="eyebrow">Atingem a meta mínima</span><span class="big">${s.ok} de ${s.meta}</span><span class="sub">unidades com meta definida que chegam ao mínimo (ocupados + vagas existentes + novas)</span></div>
  <div class="kpi"><span class="eyebrow">Falta para a referência</span><span class="big">${s.def}</span><span class="sub">soma, em todas as unidades, do que falta para a referência da tipologia</span></div>
  <div class="kpi"><span class="eyebrow">Vagas já existentes</span><span class="big">${s.all.reduce((a,i)=>a+i.vaT,0)}</span><span class="sub">códigos vagos considerados</span></div></div>${legend()}`;
  for(const g of groups()){const gt={C:0,D:0,E:0};g.units.forEach(u=>{const a=alocOf(u.id,P);LV.forEach(l=>gt[l]+=a[l])});h+=`<div class="pgt">${esc(g.nome)} <span class="muted" style="font-weight:600">· recebe ${sum3(gt)}${sum3(gt)?" ("+LV.filter(l=>gt[l]).map(l=>l+" "+gt[l]).join(", ")+")":""}</span></div>`;for(const u of g.units){const i=info(u,P);const df=i.tot-i.refT;h+=`<div class="prow"><div class="nm" title="${esc(u.nome)}">${esc(u.nome)}</div>${pbar(i)}${recv(i,true)}<div class="st">${i.occT} → <b>${i.tot}</b> / ${i.refT} (${df>=0?"+"+df:df})${i.meta!==null?` · meta ${i.meta}`:""}</div></div>`}}
  return h+`</div>`;
}

/* ---------- tela: propostas prontas ---------- */
function viewProntas(){
  let h=`<div class="card-h"><div><h2>Propostas</h2><div class="muted">Tudo é salvo automaticamente. As propostas que você está montando ficam em <b>Em preenchimento</b>; ao tocar em <b>Concluir</b>, elas passam para <b>Concluídas</b>, onde podem ser comparadas e aprovadas.</div></div><button class="pri" data-act="new">Nova proposta</button></div>`;
  if(!S.props.length)return h+`<div class="empty">Nenhuma proposta ainda.<br><br><button class="pri" data-act="new">Começar a primeira proposta</button></div>`;
  const all=[...S.props].sort((a,b)=>(b.atualizadaEm||"").localeCompare(a.atualizadaEm||""));
  const drafts=all.filter(isDraft),list=all.filter(p=>!isDraft(p));
  if(!S.cmp)S.cmp=list.slice(0,4).map(p=>p.id);
  const G=groups();const rec=sum3(pool({aloc:{}}).rec);const fmt=d=>d?new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"–";
  h+=`<section class="psec"><div class="psec-h"><h3>Em preenchimento</h3><span class="cnt">${drafts.length}</span></div>`;
  if(!drafts.length)h+=`<div class="muted psec-e">Nenhuma proposta em preenchimento. Use <b>Nova proposta</b> ou <b>Duplicar</b> uma concluída para começar.</div>`;
  else{h+=`<div class="dcards">`;for(const p of drafts){const s=stats(p);const pc=rec?Math.round(s.aloc/rec*100):0;const cur=p.id===S.curId;
    h+=`<article class="dcard ${cur?"cur":""}"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><h3>${esc(p.nome)}</h3><div class="muted">Última alteração ${fmt(p.atualizadaEm)}</div></div>${cur?'<span class="chip warn">Aberta agora</span>':'<span class="chip mute">Rascunho</span>'}</div>
    <div><div class="dprog"><i style="width:${Math.min(100,pc)}%"></i></div><div class="small muted" style="margin-top:6px">${s.aloc} de ${rec} vagas distribuídas · saldo ${LV.map(l=>l+" "+s.pool.sd[l]).join(" · ")} · meta ${s.ok}/${s.meta}</div></div>

  if(S.focusId&&propById(S.focusId))h+=panoramaHTML(propById(S.focusId),propById(S.focusId).nome);
  const C=S.cmp.map(propById).filter(Boolean);const LET="ABCDEFGH";const PC=["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)","var(--g6)"];

    h+=`<div class="cmp" style="margin-top:10px"><table class="cmpt"><thead><tr><th class="cu">Unidade</th><th class="now">Situação atual<div class="muted">ocupados + vagas existentes</div></th>${C.map((p,ix)=>`<th><span class="letter" style="background:${PC[ix%PC.length]}">${LET[ix]}</span><div class="thn">Nova situação</div><div class="muted">${esc(p.nome)}</div></th>`).join("")}</tr></thead><tbody>`;
    let shown=0;
    for(const g of G){
      const rows=g.units.filter(u=>{if(!S.cmpDiff||C.length<2)return true;const v=C.map(p=>trip(alocOf(u.id,p)));return v.some(x=>x!==v[0])});
      if(!rows.length)continue;
      h+=`<tr class="gh"><td colspan="${C.length+2}">${esc(g.nome)}</td></tr>`;
      for(const u of rows){shown++;const i0=info(u,{aloc:{},metas:C[0].metas,excluidas:C[0].excluidas});const vals=C.map(p=>trip(alocOf(u.id,p)));const diff=C.length>1&&vals.some(x=>x!==vals[0]);const now=i0.occT+i0.vaT;
        h+=`<tr class="${diff?"dif":""}"><td class="cu"><b>${esc(u.nome)}</b>${diff?' <span class="chip warn">difere</span>':""}<div class="muted">referência ${i0.refT} (${lvl(i0.ref)})</div></td>
        <td class="now"><div class="cc"><div class="ccn"><b class="z2">${now}</b><span>de ${i0.refT}</span></div><div class="ccf">${lvl(atual(i0))}</div>${mbar(i0,false)}<span class="chip ${now>=i0.refT?"ok":"mute"}">${now>=i0.refT?"tipologia completa":"faltam "+(i0.refT-now)}</span></div></td>
        ${C.map(p=>{const i=info(u,p);const st=stOf(i);return `<td><div class="cc"><div class="ccn"><b>${i.tot}</b><span>de ${i.refT}</span>${i.noT?`<em>+${i.noT}</em>`:`<em class="z">+0</em>`}</div><div class="ccf">${lvl(i.prev)}</div>${mbar(i,true)}<span class="chip ${st[0]}">${st[1]}</span></div></td>`}).join("")}</tr>`}
      h+=`<tr class="sub"><td class="cu">Subtotal ${esc(g.nome)}</td><td class="now">${g.units.reduce((a,u)=>{const i=info(u,{aloc:{}});return a+i.occT+i.vaT},0)}</td>${C.map(p=>`<td>${g.units.reduce((a,u)=>a+info(u,p).tot,0)} <b>(+${g.units.reduce((a,u)=>a+sum3(alocOf(u.id,p)),0)})</b></td>`).join("")}</tr>`;

  }
  /* entre campi */
  const P=propById(S.cmpP)||list.find(p=>p.aprovada)||C[0]||list[0];

  const IU=selU.map(id=>{const u=S.base.unidades.find(x=>x.id===id);return{u,i:info(u,P)}});

  h+=`<div class="lg" style="margin-top:16px"><span><i class="sw" style="background:var(--occ)"></i>Atual</span><span><i class="sw" style="background:var(--accent)"></i>Vagas novas</span><span><i class="sw" style="background:var(--fg-2);border-radius:2px;width:3px"></i>Referência</span><span><i style="border-left:2.5px dotted var(--bad);height:12px"></i>Meta</span></div>
  <div class="cbars">${IU.map(({u,i})=>{const now=i.occT+i.vaT;return `<div class="cbr"><div class="cbn">${esc(u.nome)}</div><div class="cbt"><i style="width:${now/mx*100}%;background:var(--occ)"></i>${i.noT?`<i style="width:${i.noT/mx*100}%;background:var(--accent)"></i>`:""}<s style="left:calc(${i.refT/mx*100}% - 1px)"></s>${i.meta!==null?`<u style="left:${i.meta/mx*100}%"></u>`:""}</div><div class="cbv">${now} → <b>${i.tot}</b> / ${i.refT}</div></div>`}).join("")}</div>`;
  h+=`<div class="ccards">${IU.map(({u,i})=>{const a=atual(i);const st=stOf(i);const row=(lab,r,at,nv,ne)=>`<tr><th>${lab}</th><td>${r}</td><td>${at}</td><td class="nv">${nv?"+"+nv:"–"}</td><td><b>${ne}</b></td><td class="${ne-r<0?"neg":""}">${ne-r>0?"+":""}${ne-r}</td></tr>`;
    return `<article class="ccard"><div class="cch"><div><b>${esc(u.nome)}</b><div class="muted">${esc(tipOf(u)?.nome||"Sem tipologia")}</div></div><span class="chip ${st[0]}">${st[1]}</span></div>
    <div class="ccbig"><div><span>Atual</span><b>${i.occT+i.vaT}</b></div><div class="arr" aria-hidden="true">→</div><div><span>Nova</span><b>${i.tot}</b></div><div><span>Referência</span><b>${i.refT}</b></div></div>
    <table class="cct"><thead><tr><th></th><th>Ref.</th><th>Atual</th><th>Novas</th><th>Nova</th><th>Dif. ref.</th></tr></thead><tbody>${LV.map(l=>row(`<span class="lvdot lv-${l}">${l}</span>`,i.ref[l],a[l],i.no[l],i.prev[l])).join("")}${i.ab?`<tr><th>s/ nível</th><td>–</td><td>${i.ab}</td><td>–</td><td>${i.ab}</td><td></td></tr>`:""}${row("Total",i.refT,i.occT+i.vaT,i.noT,i.tot)}</tbody></table></article>`}).join("")}</div></div>`;
  return h;
}


/* ---------- tela: construir ---------- */
function viewConstruir(){
  const drafts=S.props.filter(isDraft).sort((a,b)=>(b.atualizadaEm||"").localeCompare(a.atualizadaEm||""));
  if(!S.cur||!S.curId)return `<div class="card"><h2 style="margin-bottom:6px">Qual proposta você quer preencher?</h2><div class="muted" style="margin-bottom:14px">Tudo o que você lança é salvo automaticamente.</div>${drafts.length?`<div class="eyebrow" style="margin-bottom:8px">Em preenchimento</div><div class="plist">${drafts.map(p=>`<button class="pitem" data-act="edit" data-id="${esc(p.id)}"><b>${esc(p.nome)}</b><span>${stats(p).aloc} vagas distribuídas · alterada em ${p.atualizadaEm?new Date(p.atualizadaEm).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"–"}</span></button>`).join("")}</div>`:""}<div class="row" style="margin-top:14px"><button class="pri" data-act="new">Nova proposta</button><button class="ghost" data-go="prontas">Ver todas as propostas</button></div></div>`;
  const p=pool();const s=stats();const draft=isDraft(S.cur);
  const tm=S.cur.atualizadaEm?new Date(S.cur.atualizadaEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  const stChip=S.saveState==="err"?'<span class="chip bad">Erro ao salvar — tentando de novo ao alterar</span>':(S.dirty||S.saveState==="saving")?'<span class="chip mute">Salvando…</span>':S.saveState==="local"?'<span class="chip warn">Sem armazenamento nesta visualização</span>':`<span class="chip ok">Salvo automaticamente ${tm}</span>`;
  const others=drafts.filter(x=>x.id!==S.curId);
  let h=`<div class="card"><div class="card-h" style="margin:0"><div style="flex:1;min-width:240px"><div class="eyebrow">${draft?"Proposta em preenchimento":"Proposta concluída"+(S.cur.aprovada?" e aprovada":"")+" — alterações são gravadas nela"}</div><input type="text" class="namebox" id="pname" aria-label="Nome da proposta" data-act="pname" value="${esc(S.cur.nome)}"></div>
  <div class="row">${others.length?`<select id="swProp" data-act="swProp" aria-label="Trocar de proposta"><option value="">Trocar para outra em preenchimento…</option>${others.map(o=>`<option value="${esc(o.id)}">${esc(o.nome)}</option>`).join("")}</select>`:""}<button class="ghost" data-act="new">Nova proposta</button><button class="ghost" data-go="prontas">Todas as propostas</button></div></div>
  <div class="where">${draft?`Esta proposta fica em <b>Propostas › Em preenchimento</b> e é salva automaticamente a cada alteração — pode sair e voltar quando quiser. Quando terminar, toque em <b>Concluir proposta</b> para movê-la para as concluídas.`:`Esta proposta já está em <b>Propostas › Concluídas</b>. O que você mudar aqui é gravado nela automaticamente. Para testar mudanças sem alterá-la, use <b>Fazer uma cópia</b>.`}</div></div>`;
  const xr=(S.confirm||"").startsWith("exclRet:")?S.confirm.slice(8):null;const xu=xr&&S.base.unidades.find(u=>u.id===xr);const xa=xr?alocOf(xr):null;
  h+=`<div class="dock ${sum3(p.sd)===0&&!LV.some(l=>p.sd[l]<0)?"done":LV.some(l=>p.sd[l]<0)?"over":""}"><div class="dk-saldo"><div class="dk-tt"><b>${sum3(p.sd)}</b><span>${LV.some(l=>p.sd[l]<0)?"vagas alocadas<br>além do recebido":sum3(p.sd)===0?"tudo distribuído":"vagas disponíveis<br>para distribuir"}</span></div>${LV.filter(l=>p.rec[l]||p.sd[l]).map(l=>`<div class="dk-n dk-${l} ${p.sd[l]<0?"neg":p.sd[l]===0?"zero":""}" title="Nível ${l}: recebidas ${p.rec[l]}, alocadas ${p.al[l]}"><span class="lvdot lv-${l}">${l}</span><b>${p.sd[l]}</b><span class="dk-of">de ${p.rec[l]}</span></div>`).join("")}<span class="dk-m" title="Unidades com meta definida que chegam ao mínimo">meta ${s.ok}/${s.meta}</span>${sum3(retOf())?`<span class="dk-m" title="Vagas já existentes retiradas de campi com excedente e devolvidas ao saldo">inclui ${sum3(retOf())} remanejada${sum3(retOf())>1?"s":""}</span>`:""}</div>
  <div class="dk-act">${stChip}${draft?`<button class="pri" data-act="concluir" data-id="${esc(S.curId)}">Concluir proposta</button>`:`<button data-act="saveAs">Fazer uma cópia</button>`}</div>
  ${LV.some(l=>p.sd[l]<0)?`<div class="dk-msg bad">Mais vagas alocadas do que recebidas no nível ${LV.filter(l=>p.sd[l]<0).join(", ")}.</div>`:""}
  ${xu?`<div class="dk-msg">${esc(xu.nome)} saiu da meta, mas ainda tem ${sum3(xa)} vaga${sum3(xa)>1?"s":""} lançada${sum3(xa)>1?"s":""} (${LV.filter(l=>xa[l]).map(l=>l+" "+xa[l]).join(", ")}). <button class="danger" data-act="exclRetYes" data-id="${esc(xr)}">Devolver ao saldo</button> <button class="ghost" data-act="cancel">Manter</button></div>`:""}</div>`;
  h+=`<div class="steps" role="tablist">${[[1,"Diretrizes e metas"],[2,"Distribuição por nível"]].map(([k,t])=>`<button class="step" role="tab" aria-selected="${S.step===k}" data-act="step" data-id="${k}"><b>${k}</b>${t}</button>`).join("")}</div>`;
  return h+(S.step===1?stepMetas():stepNiveis());
}
function stepMetas(){
  const others=S.props.filter(x=>x.id!==S.curId&&!isDraft(x));
  let h=`<div class="card"><h2 style="margin-bottom:6px">Diretriz</h2><div class="muted" style="margin-bottom:10px">Descreva o critério que orienta esta proposta.</div><input type="text" id="pdesc" data-act="pdesc" placeholder="Ex.: campi 70/45 com ao menos 42 servidores; campi novos com 15" value="${esc(S.cur.descricao||"")}" style="width:100%"></div>`;

/* ---------- módulo: definição de cargos ---------- */
const NV=["A","B","C","D","E"];
function normC(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)/g," ").replace(/-\s*\d{5,}.*$/," ").replace(/\b\d+\s*h(oras)?\b/g," ").replace(/[^a-z]+/g," ").replace(/\b(area|pcife|pcmed|pcctae|habilitacao)\b/g," ").replace(/\baux\b/g,"auxiliar").replace(/\btec\b/g,"tecnico").replace(/\s+/g," ").trim()}
let _cat=null;function catMap(){if(_cat)return _cat;_cat={};for(const c of CARGOS_BASE){const k=normC(c);if(!_cat[k])_cat[k]=c}return _cat}
function niceC(s){const ck=catMap()[normC(s)];if(ck)return ck;let x=String(s||"").replace(/\s*\((PCIFE|PCMED|PCCTAE)\)/gi,"").replace(/\s*-\s*\d{5,}\s*$/,"").replace(/\s+/g," ").trim();if(x&&x===x.toUpperCase()){const low=["de","da","do","das","dos","e","em"];x=x.toLowerCase().split(" ").map((w,i)=>i&&low.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ").replace(/-([a-z])/g,(m,c)=>"-"+c.toUpperCase())}return x}
function normU(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function matchUnit(raw){
  const map=S.base.mapUnidades||{};const k=normU(raw);if(map[k]!==undefined)return map[k];
  const U=S.base.unidades;
  let best=null,bl=0;for(const u of U){const nn=normU(u.nome);if(nn&&k.includes(nn)&&nn.length>bl){best=u.id;bl=nn.length}}
  if(best)return best;
  const toks=k.split(" ");for(const u of U){if(toks.includes(u.sigla.toLowerCase())&&u.sigla.length>=2)return u.id}
  if(/reitoria/.test(k))return U.find(u=>u.tipologia==="tRE")?.id||"";
  return "";
}
function nivelMap(){
  const m={};const add=(c,l)=>{if(c&&NV.includes(l)){const k=normC(c);if(!m[k])m[k]=l}};
  S.base.vagas.forEach(v=>add(v.cargo,v.nivel));S.base.lotes.forEach(v=>add(v.cargo,v.nivel));
  (S.quadro?.linhas||[]).forEach(r=>add(r.cargo,r.nivel));Object.values(S.desej||{}).forEach(d=>(d.linhas||[]).forEach(r=>add(r.cargo,r.nivel)));
  return m;
}
const libs={};
function loadScript(src){return libs[src]||(libs[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error("Não foi possível carregar "+src))};document.head.appendChild(s)}))}
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",XLSXJS="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
async function pdfText(file){
  await loadScript(PDFW);await loadScript(PDFJS);window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const pages=[];
  for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent();const rows={};
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)}
    pages.push(Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join(" | ")).join("\n"));
    setProg(`Lendo o PDF: página ${p} de ${doc.numPages}`);}
  return pages;
}
function setProg(t){S.prog=t;const el=$("#prog");if(el)el.textContent=t}
async function askJSON(prompt){if(!S.sample)throw new Error("Este arquivo não segue o modelo padrão da DIGPE e a leitura por IA não está disponível nesta versão do sistema. Use o relatório no modelo padrão, uma planilha, ou digite a proposta manualmente.");return S.sample.json(prompt,{modelTier:"default"})}
async function chunksOf(pages){let lim=60000;try{const L=await S.sample.limits();if(L?.maxInputBytes)lim=Math.min(lim,Math.floor(L.maxInputBytes/2)-3000)}catch(_){}const out=[];let cur="";for(const p of pages){if(cur&&(cur.length+p.length)>lim){out.push(cur);cur=""}if(p.length>lim){for(let i=0;i<p.length;i+=lim)out.push(p.slice(i,i+lim))}else cur+=p+"\n"}if(cur)out.push(cur);return out}

function loadSheet(){const ws=S.imp.wb.Sheets[S.imp.sheet];const rows=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:""}).filter(r=>r.some(c=>String(c).trim()));

function classify(sit,org){const st=normU(sit),o=normU(org);
  if(/aposent|inativ|pensao|pensionista|instituidor|falecid|obito/.test(st))return["apo","Aposentado ou inativo"];
  if(o&&!/ifrn|rio grande do norte|instituto federal do rn/.test(o))return["out","Servidor de outro órgão ("+org+")"];
  if(/requisitad|cedido ao ifrn|cedido para o ifrn|de outro orgao/.test(st))return["out","Servidor de outro órgão ("+sit+")"];
  if(/requisitad|exercicio provisorio|colaboracao tecnica|exercicio descentralizado|lotacao provisoria|cedid|outro orgao|sem vinculo|temporari|contratad|estagiari|visitante|substitut|anistiad|excedente|disponibilidade|nomeado/.test(st))return["duv","Situação: "+sit];
  if(!st||/ativo|estatutari|efetivo|em exercicio|permanente/.test(st))return["inc",""];
  return["duv","Situação: "+sit];}

  I.cnt.duvM=I.items.filter(x=>x.cls==="duv"&&x.dec==="manter").length;I.cnt.duvE=I.items.filter(x=>x.cls==="duv"&&x.dec==="excluir").length;I.rec=Object.values(agg);prepMapping()}

/* leitura do modelo padrão de relatório de dimensionamento do IFRN (Quadro 1 e Quadro 2) */
function parseModelo(text){
  const lines=text.split(/\n/).map(l=>l.replace(/\s*\|\s*/g," ").replace(/\s+/g," ").trim());
  const RC="(.+?\\((?:PCIFE|PCMED|PCCTAE)\\)\\s*-\\s*\\d{6})";
  const R2=new RegExp("^(\\d{1,3})\\s+([A-ZÇ]{2,8})\\s+([A-ZÇ/\\-]{2,12})\\s+([A-E])\\s+"+RC,"i"),R1=new RegExp("^([A-E])\\s+"+RC,"i");
  let q2=false;const postos=[],estr=[];
  for(const l of lines){if(/quadro\s*2/i.test(l))q2=true;let m=l.match(R2);if(m){postos.push({dir:m[2],setor:m[3],nivel:m[4].toUpperCase(),cargo:m[5].trim()});continue}
    if(!q2){m=l.match(R1);if(m)estr.push({nivel:m[1].toUpperCase(),cargo:m[2].trim()})}}
  return{postos,estr};
}

    else text=(await pdfText(file)).join("\n");

      S.impC.linhas=Object.entries(agg).map(([k,a])=>({cargo:a.cargo,nivel:a.nivel,qtd:a.qtd,estrategico:est.has(k),obs:[...new Set(a.set)].join(", ")}));

/* comparação e definição */
function defProp(){return S.props.find(p=>p.aprovada&&!isDraft(p))||null}
function defUnitsNew(P){return S.base.unidades.filter(u=>sum3(alocOf(u.id,P))>0)}
function defProg(P){let av=0,us=0,done=0,started=0;const us_=defUnitsNew(P);for(const u of us_){const b=defBudget(u,P);const a=sum3(b.av),k=Math.min(a,sum3(b.used));av+=a;us+=k;if(k>=a)done++;if(k>0)started++}return{av,us,done,started,n:us_.length}}
function defsOf(pid){return S.defs[pid]||(S.defs[pid]={unidades:{}})}
function unitRows(u,P){
  const rows={};const get=(c,l)=>{const k=normC(c);if(!k)return null;return rows[k]||(rows[k]={k,cargo:niceC(c),nivel:l||"",atual:0,desejado:null,exist:0,def:0})};
  for(const r of S.quadro?.linhas||[])if(r.u===u.id){const x=get(r.cargo,r.nivel);if(x){x.atual+=n(r.qtd);if(!x.nivel)x.nivel=r.nivel}}
  for(const r of S.desej?.[u.id]?.linhas||[]){const x=get(r.cargo,r.nivel);if(x){x.desejado=(x.desejado||0)+n(r.qtd);if(!x.nivel)x.nivel=r.nivel;if(r.estrategico)x.est=true;if(r.obs)x.set=r.obs}}
  for(const v of S.base.vagas)if(v.unidade===u.id&&vOk(v,P)){const x=get(v.cargo,v.nivel);if(x){x.exist++;if(!x.nivel)x.nivel=v.nivel}}
  const D=P?defsOf(P.id).unidades[u.id]?.linhas||[]:[];for(const d of D){const x=get(d.cargo,d.nivel);if(x){x.def+=n(d.qtd);if(!x.nivel)x.nivel=d.nivel}}
  const nm=nivelMap();Object.values(rows).forEach(r=>{if(!r.nivel)r.nivel=nm[r.k]||""});
  return Object.values(rows).sort((a,b)=>(a.nivel||"Z").localeCompare(b.nivel||"Z")||((b.desejado??0)-b.atual)-((a.desejado??0)-a.atual)||a.cargo.localeCompare(b.cargo));
}
function excCargos(u,P){if(!S.desej[u.id])return[];return unitRows(u,P).map(r=>{const tem=r.atual+r.exist+r.def;const ped=r.desejado??0;return{...r,tem,ped,ex:tem-ped,fora:r.desejado===null}}).filter(r=>r.ex>0&&LV.includes(r.nivel)).sort((a,b)=>a.nivel.localeCompare(b.nivel)||b.ex-a.ex)}
function defBudget(u,P){const av=alocOf(u.id,P);const used={C:0,D:0,E:0};for(const d of defsOf(P.id).unidades[u.id]?.linhas||[])if(used[d.nivel]!==undefined)used[d.nivel]+=n(d.qtd);const rest={};LV.forEach(l=>rest[l]=av[l]-used[l]);return{av,used,rest}}
function setDef(uidv,cargo,nivel,q){const P=defProp();const d=defsOf(P.id);const U=d.unidades[uidv]||(d.unidades[uidv]={linhas:[]});const k=normC(cargo);const ex=U.linhas.find(l=>normC(l.cargo)===k);if(ex){ex.qtd=Math.max(0,q);ex.nivel=nivel||ex.nivel}else if(q>0)U.linhas.push({cargo:niceC(cargo),nivel,qtd:q});U.linhas=U.linhas.filter(l=>n(l.qtd)>0||l.manual);touchDef()}
function sugerir(uidv){const P=defProp();const u=S.base.unidades.find(x=>x.id===uidv);const b=defBudget(u,P);const rows=unitRows(u,P);let semGap={};
  for(const l of LV){let rem=b.rest[l];while(rem>0){const c=rows.filter(r=>r.nivel===l&&r.desejado!==null).map(r=>({r,g:r.desejado-r.atual-r.exist-r.def})).filter(x=>x.g>0).sort((a,b)=>b.g-a.g)[0];if(!c)break;c.r.def++;setDef(uidv,c.r.cargo,l,c.r.def);rem--}if(rem>0)semGap[l]=rem}

}

    case "cmpP":S.cmpP=t.value;render();break;
    case "cmpAddG":{const g=groups().find(x=>x.id===t.value);if(g){const st=new Set(S.cmpU||[]);g.units.forEach(u=>st.add(u.id));S.cmpU=[...st]}render();break}
    case "upUnit":S.upUnit=t.value;render();break;
    case "dset":setDef(t.dataset.u,t.dataset.c,t.dataset.l,n(t.value));render();break;
    case "fQuadro":if(t.files[0])importQuadroFile(t.files[0]);break;
    case "fCampus":if(t.files[0])importCampusFile(t.files[0],id);window.scrollTo(0,0);break;
    case "impSheet":S.imp.sheet=t.value;loadSheet();render();break;
    case "impCol":S.imp.cols[id]=n(t.value);break;
    case "impU":S.imp.units[n(id)].u=t.value;render();break;
    case "cEd":{const l=S.impC.linhas[n(id)];l[f]=f==="qtd"?Math.max(0,n(t.value)):t.value;break}
    case "grp":S.grouping=t.value;save("dim.grp",S.grouping);render();break;
    case "pname":S.cur.nome=t.value||"Proposta sem nome";markDirty();break;
    case "swProp":if(t.value)editProp(t.value);break;
    case "pdesc":S.cur.descricao=t.value;markDirty();break;
    case "metaU":{S.cur.metasU=S.cur.metasU||{};if(t.value==="")delete S.cur.metasU[id];else{S.cur.metasU[id]=n(t.value);S.cur.excluidas=(S.cur.excluidas||[]).filter(x=>x!==id)}markDirty();break}
    case "meta":S.cur.metas=S.cur.metas||{};if(t.value==="")delete S.cur.metas[id];else S.cur.metas[id]=n(t.value);markDirty();break;
    case "aloc":{S.cur.aloc=S.cur.aloc||{};const l=t.dataset.l;const o=S.cur.aloc[id]||(S.cur.aloc[id]={C:0,D:0,E:0});const cur=n(o[l]);const mx=cur+Math.max(0,pool().sd[l]);let v=Math.max(0,n(t.value));if(v>mx){v=mx;flash(`Só há ${mx-cur} vaga(s) de nível ${l} disponível(is): o valor foi ajustado para ${v}.`,"warn")}o[l]=v;markDirty();break}
    case "excl":setExcl(id,t.checked);break;
    case "cl":{const ln=(S.cur.cargos[t.dataset.u]||[]).find(l=>l.id===id);if(ln){ln[f]=f==="qtd"?Math.max(0,n(t.value)):t.value;markDirty()}break}
    case "vnota":S.cur.vagaNotas=S.cur.vagaNotas||{};S.cur.vagaNotas[id]=t.value;markDirty();break;
    case "tEd":{const x=B.tipologias.find(q=>q.id===id);if(f==="nome")x.nome=t.value;else x.ref[f]=Math.max(0,n(t.value));touchBase();break}
    case "uEd":{const u=B.unidades.find(q=>q.id===id);if(f[0]==="o"&&f.length===2){u.ocup=u.ocup||{};u.ocup[f[1]]=Math.max(0,n(t.value))}else if(f[0]==="r"&&f.length===2){u.ref=u.ref||{};if(t.value==="")delete u.ref[f[1]];else u.ref[f[1]]=n(t.value);if(!Object.keys(u.ref).length)delete u.ref}else if(f==="ab")u.ab=Math.max(0,n(t.value));else u[f]=t.value;touchBase();break}
    case "egSel":S.editGrouping=t.value;render();break;
    case "agName":B.agrupamentos.find(g=>g.id===id).nome=t.value;touchBase();break;
    case "grName":{const ag=B.agrupamentos.find(g=>g.id===t.dataset.ag);ag.grupos.find(g=>g.id===id).nome=t.value;touchBase();break}
    case "grAssign":{const ag=B.agrupamentos.find(g=>g.id===t.dataset.ag);ag.grupos.forEach(g=>g.unidades=(g.unidades||[]).filter(x=>x!==id));if(t.value)ag.grupos.find(g=>g.id===t.value).unidades.push(id);touchBase();break}
    case "vEd":{const v=B.vagas[n(t.dataset.ix)];v[f]=f==="considerar"?t.checked:t.value;touchBase();break}
    case "lEd":{const lt=B.lotes.find(q=>q.id===id);lt[f]=f==="qtd"?Math.max(0,n(t.value)):t.value;touchBase();break}
  }
});
window.addEventListener("beforeunload",e=>{if(S.dirty)flushProp();if(S.dirty||S.defDirty){e.preventDefault();e.returnValue=""}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.dirty)flushProp()});

/* ---------- inicialização ---------- */
render();
(async()=>{
  let db=null;try{db=await window.claude?.use?.("db")}catch(_){}
  if(!db){S.dbState="none";render();$("#status").innerHTML=`<div class="toast">Não foi possível conectar ao banco de dados. Verifique a conexão e recarregue a página.</div>`;return}
  S.db=db;
  window.claude.use("sample").then(x=>{S.sample=x}).catch(()=>{});
  window.claude.use("downloads").then(x=>{S.downloads=x}).catch(()=>{});
  db.doc("quadro/atual").onSnapshot(sn=>{if(sn.exists){S.quadro=clone(sn.data());render()}},()=>{});
  db.collection("desejado").onSnapshot(qs=>{S.desej={};qs.docs.forEach(d=>S.desej[d.id]=clone(d.data()));render()},()=>{});
  db.collection("definicoes").onSnapshot(qs=>{if(S.defDirty)return;S.defs={};qs.docs.forEach(d=>S.defs[d.id]=clone(d.data()));render()},()=>{});
  const timer=setTimeout(()=>{if(!S.base)$("#status").innerHTML=`<div class="toast">Os dados ainda não responderam. Verifique a conexão; a página continua tentando.</div>`},10000);
  db.doc("ws/base").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);S.dbState="ok"}
    if(snap.exists){if(!baseLocal||!S.base)S.base=clone(snap.data())}else if(!snap.metadata.fromCache)S.dbState="empty";
    if(S.base)["tipologias","unidades","agrupamentos","vagas","lotes"].forEach(k=>S.base[k]=S.base[k]||[]);
    render();
  },err=>{clearTimeout(timer);S.dbState="empty";flash("Erro ao carregar os cadastros: "+err.code,"warn");render()});
  db.collection("propostas").onSnapshot(qs=>{
    S.props=qs.docs.map(d=>({id:d.id,...clone(d.data())}));
    if(!S.cur){let id=null;try{id=localStorage.getItem("dim2.cur")}catch(_){}const p=id&&propById(id);if(p){S.cur=strip(p);S.curId=p.id;S.saveState="ok"}}
    else if(S.curId&&!S.dirty&&!propWriting){const p=propById(S.curId);if(p)S.cur=strip(p);else{S.cur=null;S.curId=null}}
    render();
  },err=>flash("Erro ao carregar as propostas: "+err.code,"warn"));
})();
</script>

<script>
/* aviso de nova versão publicada */
(function(){const BUILD="2026-11-11-2030";let shown=false;
async function chk(){if(shown)return;try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/const BUILD="([^"]+)"/);if(m&&m[1]!==BUILD){shown=true;const d=document.createElement("div");d.className="newver";d.innerHTML='Há uma versão nova do sistema. <button type="button">Atualizar agora</button>';d.querySelector("button").onclick=()=>location.reload();document.body.appendChild(d)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});setInterval(chk,180000);setTimeout(chk,5000);})();
</script>
<style>.newver{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 12px 10px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}.newver button{background:var(--accent);color:var(--accent-fg)}</style>
</body>
